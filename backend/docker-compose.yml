services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitwise}
      POSTGRES_DB: ${POSTGRES_DB:-gitwise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/storage/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitwise} -d ${POSTGRES_DB:-gitwise}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
